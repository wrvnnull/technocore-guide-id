name: Generate Technocore DID
on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: 'Passphrase for identity.pem (12+ chars)'
        required: true
        type: string

jobs:
  did:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python3 technocore_agent.py init
        env:
          PASSPHRASE: ${{ inputs.passphrase }}
      - run: python3 technocore_agent.py did
      - run: python3 technocore_agent.py say lobby "Hello from a new Technocore contributor."
        env:
          PASSPHRASE: ${{ inputs.passphrase }}
      - uses: actions/upload-artifact@v4
        with:
          name: identity-pem
          path: identity.pem
          retention-days: 7
